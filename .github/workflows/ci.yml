name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
      - run: pip install -r requirements-dev.txt
      - name: Sprite and metadata are built from icons-src and consistent
        run: python scripts/build-icons.py --check
      - name: SVG export tests
        run: node --test tests/svg-export.test.cjs
